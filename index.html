<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
    <section>
        <h2>Team A</h2>
        <p>Score: <span id="score-a">0</span></p>
        <div class="buttons">
            <button type="button" id="decrement-a">−</button>
            <button type="button" id="increment-a">+</button>
        </div>
    </section>

    <section>
        <h2>Team B</h2>
        <p>Score: <span id="score-b">0</span></p>
        <div class="buttons">
            <button type="button" id="decrement-b">−</button>
            <button type="button" id="increment-b">+</button>
        </div>
    </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
